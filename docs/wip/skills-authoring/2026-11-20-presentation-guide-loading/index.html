<h1>How agents find the right Demistify component</h1>
<p>Design names what the reader needs to understand. The presentation skill chooses a view. The guide that matches the runtime shows how to write it.</p>
<ex-mermaid id="guide-route" label="From a design question to the hand-authored page"><script type="text/plain">
flowchart LR
  Question["Design skill<br/>Reader question and required facts"] --> View["Presentation skill<br/>Choose the component"]
  View --> Guide["Matching Demistify guide<br/>Open the selected reference"]
  Guide --> Review["Authored HTML<br/>Check links and markup"]
</script></ex-mermaid>
<ex-markdown id="requirements"><script type="application/json" data-ex-markdown-source="">{"text":"## Requirements\n\nAn agent authoring a design or engineering PR should be able to choose a component from the reader's question, find the instructions for the binding it will use, and produce hand-written HTML with stable links that another agent can follow. A routine one-page change should avoid reading instructions for unrelated components.\n\nThis is a proposed update to presentation-html, reached directly by an author or from a design phase. The November 20 owner request supplies the authoring basis. The source audit found two things in the current route: overlapping component reads, including a Walkthrough reference for some pages without a tour, and a binding guide that describes hosted and source-preview use while leaving ordinary versioned local delivery implicit. The Demistify source audit counted about 38,600 tokens across its main guide and references, including about 4,390 for the entry guide and its mandatory content reference. Those are text counts.\n\nThe existing trigger, source ownership, component APIs, and visual verification responsibilities carry forward.\n","reference":"./requirements.md"}</script></ex-markdown>
<ex-markdown id="specification"><script type="application/json" data-ex-markdown-source="">{"text":"## Specification\n\n- **R1.** Assign the reader's question and required information to the design phase, the component choice to the presentation skill, and exact syntax to the Demistify guide for the bound runtime.\n- **R2.** Load the shell and checking instructions once per binding, then load only the component references required by the selected views.\n- **R3.** Use verified local Markdown when its release matches the page's binding. For an unmatched release, use the guide for that binding.\n- **R4.** Keep the page's explanation in hand-authored HTML, with exact stable destinations for evidence and navigation. An optional typed record may derive JSON used by Pages, Map and Walkthroughs.\n- **R5.** Make a guide refresh reviewable from its release identity and the changed reference files.\n\nFor a schema change, a small table may answer the owner's choice and only the shared navigation reference is needed if the document spans pages. For a persistence change, a diagram may explain ownership and a Walkthrough may link the state transition to planned proof. That author also opens the Walkthrough reference. Both cases follow the same authority chain and keep factual prose at the authored destination.\n","reference":"./specification.md"}</script></ex-markdown>
<ex-markdown id="skill-design"><script type="application/json" data-ex-markdown-source="">{"text":"## Skill design\n\n**Proposed run 1 — presentation-html.** Place a short question-to-view mapping in the existing chooser or its directly linked reference. Include a good and bad example for the recurring reader questions in a PR. Preserve the caller's semantic fields whichever representation the author chooses. For example, planned proof can use prose, cards or a table with the scenario, observable result and rejecting case. Represent a proposed call path as a proposal, and reserve prepared call stacks for actual supplied source frames.\n\nKeep the binding procedure in the existing Demistify reference. Name the runtime, guide and matching checker once. Load the content reference when the author works with an external source, changes the delivery method or needs its data-carrier rules. Open the Walkthrough reference when the author chooses a Walkthrough. The optional worked handoff shows how another agent follows one record from need to verification and attaches an observed result to the exact revision.\n\n**Proposed follow-up runs.** Each owning design skill points to the one presentation chooser by way of the existing shared rendering reference. Each still specifies what its requirements, program structure or verification view must show. Review reads the resulting page against those semantic fields. Demistify's own guide remains the source for the shell, the component markup and the checker.\n\n### Delivery options\n\n| Option | What it helps | Cost |\n| --- | --- | --- |\n| Fetch the guide for the selected binding | Works with the published CDN release and custom bindings | A cold read needs the network |\n| Vendor matched Markdown and an index | Gives agents a local path to the sections they need | A release upgrade needs a source-controlled refresh |\n| Render an HTML manual alongside Markdown | Gives people a browsable catalog with worked examples | Adds a rendering step. Agent context still depends on what they read |\n\nRecommend the second option as the fast path, with the first as the fallback. Rendered examples can be a separate view over the same sources.\n\nFor the first refresh, take the authoring tree from a locally staged, verified Demistify release. Record the version, source commit and file digests. Review the changed Markdown and the retained link destinations. The next Demistify release can repeat the same comparison and propose a Sunstack source change. Keep the registry or CDN publish boundary separate from approval of that skill update. The initial proposal uses a manual handoff of an existing artifact. Any network-fetching updater or cross-repository workflow needs its own design and review.\n\nA site bound to the moving public v1 path can use the matching copy if the current manifest confirms its identity. When an agent cannot establish a match, it uses that binding's own guide. A versioned local reader keeps its runtime, theme, lazy assets, guide and CLI together. Guide text and examples do not authorize tool calls, credentials or publication.\n\n**Status** Proposed. Base is Sunstack 7adb3677 and a source audit of Demistify a86500d0. The implemented site-root checker belongs to [the separate CLI PR](https://github.com/ShravanSunder/sunstack-tools/pull/199). The guide-loading runs require design inspection before skill-source changes.\n","reference":"./skill-design.md"}</script></ex-markdown>
<ex-markdown id="skill-verification"><script type="application/json" data-ex-markdown-source="">{"text":"## Skill verification\n\n- **R1 and R4** use a review of a requirement-to-verification handoff and a program design with stable HTML anchors. A reader should reach the exact evidence from the links. Inspect the HTML and its companion Markdown or JSON where present.\n- **R2** uses fresh runs of two comparable tasks, one small review page and one multi-page design with a tour. Record the guide files and text loaded, revisions, elapsed time, repairs and whether the links and authored page pass. Compare cold and cached retrieval separately from context or output tokens. No fresh-agent token savings have been measured.\n- **R3 and R5** use deterministic cases with a matching local release and a mismatched binding. In the first case all reference links and digests resolve locally. In the second the author uses the version's own guide. A view served from a claimed complete local distribution needs an actual browser traversal without requests to hosted assets.\n- Invocation text stays as it is, so a new trigger trial is unnecessary. Initial review covers the design proposal, and the implementation review will have the fixed skill diff and its evidence.\n","reference":"./skill-verification.md"}</script></ex-markdown>
