<h1 id="heading-verification-design">Verification Design</h1>
<p>How each requirement will be shown to hold, as a plan: nothing in it has been observed yet.</p>
<ex-markdown id="vd" label="Verification Design"><script type="application/json" data-ex-markdown-source="">{"text":"# Verification Design: skill rules\n\n3 Nov 2026. Author: 🦁 Lead. Status: draft, not reviewed. A plan: nothing in it has been observed. Proves the [Requirements](requirements/index.md) through the [Specification](specification/index.md)'s proof obligations (V1–V24) at the [Program Design](program-design.md#trace)'s seams.\n\n## How we will know it works\n\n| Capability | Proven by | What stays unverified |\n| --- | --- | --- |\n| rule-making | Each rule's case report shows the mistake it exists for, checked at its source; the rule list matches the owner's decisions; the rule-file rules nudge on real bad questions | whether the owner finds each rule worth its attention: that is his read of the case report |\n| nudges | Running the rules on the whole tree gives line 17 a nudge with every part, lists what wasn't read, and exits clean on nudges alone; the skills teach acting on a nudge, with #187 worked through | whether a fresh agent acts well on a nudge: waits for the evals (owner, 31 Oct) |\n| skill-kinds | Every skill's judged kind is compared with labels made blind by two agents, disagreements decided by you; product-leak is silent on AgentStudio and Peekaboo and nudges on lines 17 and 40 | kinds on skills written after the census |\n| rule-tests | The case run shows, per rule, 3+ real mistakes, 3+ good texts, 3+ near misses and a held-back set, all passing, before the rule nudges anyone; every bar cites its cases | rules short of real cases stay held, by design; which ones depends on the mining |\n| what-rules-read | The rules read table rows and loaded files (lines 40 and 17); `completion.criterion` and `branch.condition` read the whole step and the colon block, their old read-caused wrong nudges now quiet | sections no current skill has |\n\n## Shared observations\n\nEach is planned once and named by the rows it serves.\n\n### OA: The case run\n\n`pnpm --dir tests/skills rules:expect` at the PR head, with the released engine that has owner assessment, Jev through the existing key wrapper, over every `*.cases.json`. Seen: per rule, its derived state and held reasons; cases by kind, set and label state; each failing case; held-back results apart from development; each step's bar status and cited cases.\n\n### OB: The tree run\n\n`pnpm --dir tests/skills rules` at the PR head over every current skill, same engine and model. Seen: nudges with their parts; each skill's kind and how sure; gaps per rule (unread, cut, unresolved, kind unsure, no owner); gate exclusions with answers; held rules with what they lack; exit status.\n\n### OC: The kind census\n\nTwo agents label every current skill's kind from its description, blind to the engine's answers and to each other; the owner decides each disagreement. Compared with OB's `assessments[]`, and with a second OB run on the same commit.\n\n### OD: Focused runner tests\n\nVitest tests beside `lib/skill-rules/` modules for the pure logic: the case-file schema, the migration (every old expectation compared with its new case, including a description case with no selector and a section case whose finding line differs from its first line), rule-state derivation (every `HeldReason`), the fingerprint's inputs, the held filter in the agent report, the gap variants. They read real case files at the PR head and records built from them; they launch no app.\n\n### OF: Forced boundary runs\n\nThe real engine and runner on Git-pinned real skills, with the decision model's responses controlled, to drive branches a live run may never reach: one owner's assessment below its bar (`unsure`), one malformed assessment response (`incomplete`), one rule answer between its bars (`uncertain`), a cancelled run, and a run over an invalid config. Seen: the actual exit status, the results and gaps the runner prints, and the retained answers. These prove the engine's and runner's handling, not the model's accuracy (OC does that).\n\n### OG: The admission checks\n\nOn a rulebook whose rule passed a complete case run: change its question, then its bars, then one case; then, separately, change only an AST rule file its kind uses, and only a kind it reads through `within` or `same_file`; delete the receipt; mark it incomplete. After each, an ordinary run with no model key. Seen: the rule listed `held` with its reason and no nudge from it.\n\n### OE: Source reads\n\nReading the changed skills, rule files, config and the engine diff against the named obligation.\n\n## The rows\n\n| U · R | Proven by | Reference | Target and observation | Passes when | Fails for | Unverified |\n| --- | --- | --- | --- | --- | --- | --- |\n| U9 · R1 (rule-making) | each nudging judged rule's reason is opened at its source | the inventory, git, GitHub | OA; OE opens every cited reason | every nudging judged rule cites a reason that exists at its locator; a judged rule with none is held `no_reason` | a rule that nudges with an empty or dead reason | whether the reason is the right one (the owner reads it) |\n| U10 · R2 (rule-making) | the case report's rule list is compared with U10's table, and a real \"Always use when\" description is run | U10; review 842d1327; the owner's 3 Nov drops | OA; OB over a real skill whose description opens \"Always use when\" | every rule's state matches U10; the dropped rules (`names-field`, `always-earned`, `reference.teaching-depth`, `guidance.positive`) give no result in OB; the \"Always\" description gets no nudge about that word | a dropped rule still giving a result; an \"Always\" description nudged for the word | — |\n| U12 · R3 (rule-making) | the candidate list is compared with the inventory | the inventory's `no` records | OE | each behavior-only episode appears once; no route text claims an agent behavior | an episode missing or doubled; a route saying \"the agent didn't run…\" | the later evals themselves |\n| U8 · R4 (rule-making) | real rule-file questions are cases of the rule-file rules | real rule files, current and in history (mined) | OA, OB | real two-thing and mismatched questions fire; real clean ones pass | a rule that passes every question or flags every question | mined cases may be few; the rule stays held if short |\n| U11 · R5 (rule-making) | the engine change is read for skill words | the `sunstack-tools` diff and release notes | OE on the engine PR | no skill-specific word, path or kind in the engine; `work_scope` lives only in this repository's config | `SKILL.md` or a kind name hard-coded in the engine | — |\n| U1 · R6 (nudges) | line 17's nudge shows every part, and so does a second real nudge; a quiet line shows none | revision 1's anchor case; the nudge rendering table in Program Design | OB at the PR head | at `ops-observability-stack/SKILL.md:17`: where; what; why with the standard's wording and line; `judged`; `warn`; finding; answers and path; cut or not; `agentstudio-loop.md` as a read place; AgentStudio's repository as a pointer in the message, never a link; and, when product-leak also nudges `practices-cleanup/SKILL.md:40`, \"same rule also nudged\" naming it on both. A general skill's line with no product content gets no nudge | a nudge at line 7 (the section start); a link to a place never read; the standard's wording missing; \"same rule\" listing a place the rule didn't nudge | — |\n| U2 · R7 (nudges) | point-only routes are read | each such route's text | OE | no point-only route states a breach | \"this is a breach\" on a point-only route | — |\n| U3 · R8 (nudges) | a rule that reads nothing in an in-scope file shows the gap | the silent-coverage case (0 pieces read in `ops-observability-stack`) | OB; OD for the variants | the gap appears per rule; exclusions appear with answers, apart; passes keep answers | an in-scope unread file absent from gaps; an exclusion listed as a gap | — |\n| U4 · R9 (nudges) | real runs end with the status their outcome calls for | engine exit statuses | OB (warn-only), OF (uncertain, incomplete, cancelled, invalid); reused `skill-rules-severity-policy.test.ts` for authored severity only (it walks rule graphs; it can't see exits) | warn-only → 0; uncertain → 5; incomplete, cancelled and invalid each report their own status; no judged path reaches `error` | an uncertain run exiting 0; a cancelled run reported clean | runs with `--max-warnings` set (not used here) |\n| U5 · R10 (nudges) | the teaching skills are read | R10's wording | OE | no skill reads a pass as meeting the standard | \"passed, so the skill meets the standard\" | a fresh agent's reading (evals) |\n| U6 · R11 (nudges) | the skills teach dispositions with #187 as the failing example | R11; #187's chain | OE | each acting skill names the four dispositions and says a property-only fix isn't `fixed` | a skill that teaches \"make the rule pass\" | a fresh agent's behavior (evals) |\n| U7 · R12 (nudges) | the nine skills are read for a worked example and a checkable completion | R12's list | OE | each named skill has both | a skill with no worked example | a fresh agent's success (evals) |\n| U13 · R13, R14 (skill-kinds) | every skill's judged kind matches the census, and gated rules skip the wrong kinds | OC's labels, owner-decided | OC + OB (twice on one commit) | judged kinds equal the labels; both runs agree; product-leak gives no result on the AgentStudio skill and Peekaboo, with the kind shown | AgentStudio judged `any_repository`; a nudge on Peekaboo's own text | skills added after the census |\n| U14 · R15 (skill-kinds) | an owner forced unsure is skipped and listed; live boundary skills are watched too | OC's boundary skills (`ops-observability-stack`, `agent-collaboration`, `presentation-html`, `scaffold-project`) | OF (forced unsure and incomplete), OB (live) | the forced-unsure owner gets no kind-gated results and a `kind unsure` gap with its answers; an incomplete assessment makes the run incomplete | an unsure owner evaluated anyway; an unsure owner's rules silently passed | — |\n| U15 · R16 (skill-kinds) | hidden skills get description results | the current hidden skills | OB | every hidden skill has description-rule results | a hidden skill skipped | — |\n| U16 · R17 (skill-kinds) | each of U16's rows is a case of product-leak | U16's real texts plus the mined general-skill negatives | OA | rows 1, 2, 4, 5, 11 fire; 3, 6–9 pass; 10 is excluded by kind | `verify-tui`'s made-up example passing (row 4); `domain-typescript`'s shadcn firing (row 6) | row 12 (no real case); rows 3 and 4 depend on A-3 |\n| U17 · R18, R19 (rule-tests) | the case report shows each nudging rule's floor and passes, its held-back group was frozen before tuning, and a change after a passing run holds the rule | the case files and receipts | OA; OG; OD for the derivation | every nudging judged rule has ≥3 of each kind and a held-back set frozen before its bars were recorded, all passing in a complete matching receipt; no fix pair split; disputed or `unknown` cases counted nowhere; after each OG change the rule is held with its reason | a rule nudging with 2 real mistakes; a migrated regression case relabelled held-back; a rule still nudging after its question changed | — |\n| U18 · R20 (rule-tests) | every nudging rule's current bar values equal the values recorded with their cases | the case files; the rule files | OA; OD (comparison and schema) | each step's current values equal `bars[step].values`, which cite development cases only; a `starting` bar holds the rule; the config has no override field | all bars left at 0.7/0.3 marked `starting` and still nudging; a value edited after it was recorded; an override key accepted | whether the tuned values are good: the held-back results speak to that |\n| U19 · R21 (rule-tests) | every case resolves at its commit with its context, and every old expectation survives migration | git; the old `*.expect.json` | OA (`pinned-source.ts` extracts each, with context); OD (migration comparison) | every case's path, context and lines exist at its commit; every old id is present with the same expect, kind, selector meaning, finding lines and label provenance; a real Sol-settled case (`calls-and-placement.expect.json:18–23`) keeps its settler and is `legacy_independent`, never `agents_agreed` or owner-decided, and counts toward no floor | a case citing a commit without its path; a migrated case that lost its finding lines or context | the runner's own synthetic fixtures (open meaning 3) |\n| U20 · R22 (what-rules-read) | every rule's evidence declaration and the report's seen/collected split are read | the rule files; the report | OE; OB | every rule declares subject, edges, descendants, cut meaning; the report shows collected and seen apart | a cut piece reported as complete | — |\n| U21 · R23 (what-rules-read) | lines 40 and 17 are both read, and every section of a general skill is in some chunk | the 1 Nov run's two right nudges | OB with a per-section count | both lines are in product-leak's pieces; no general skill's section is outside every chunk | line 40's table row unread | — |\n| U22 · R24 (what-rules-read) | both repaired rules are quiet on their old read-caused wrong nudges and still fire on a real case of their mistake | the 30 Oct dispositions (`step5/dispositions.md`); D35 | OA, with those texts as cases | `completion.criterion` passes a done state in other words; `branch.condition` passes a colon-ended `IF` whose block names the condition; each still fires on its real mistake | a step without `Completion:` still nudged; a colon branch judged without its block | — |\n\n## Journeys\n\nNone needed. The entries are the runner's two commands and the skills' text; there is no app and no `verify-\u003capp>` skill in this repository. Every observation above is a real-path run (OA, OB), a census (OC), a focused test (OD) or a source read (OE).\n\n## Limits that need the owner\n\n- **Fresh-agent behavior** (U5–U7, U11's \"acts on the nudge\"): unverified until the evals, as the owner set on 31 Oct. Not a new limit.\n- **Keyed runs cost model calls** (OA, OB twice, OC's comparison). Within the owner's standing Jev approval; no new access.\n","reference":"./verification-design.md"}</script></ex-markdown>
