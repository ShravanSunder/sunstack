{
  "id": "load",
  "language": "Markdown",
  "files": ["**/SKILL.md", "**/references/**/*.md"],
  "rule":
    {
      "all":
        [
          { "kind": "paragraph", "regex": "\\b(?:load|dispatch)\\s+`[^`]+`" },
          { "not": { "inside": { "kind": "block_quote", "stopBy": "end" } } },
        ],
    },
}
---
{
  "id": "branch",
  "language": "Markdown",
  "files": ["**/SKILL.md", "**/references/**/*.md"],
  "rule":
    {
      "all":
        [
          { "kind": "paragraph", "regex": "^(?:IF|If|if|When|when)\\b" },
          { "not": { "inside": { "kind": "block_quote", "stopBy": "end" } } },
        ],
    },
}
---
{ "id": "section-heading", "language": "Markdown", "rule": { "kind": "section" } }
---
{ "id": "colon-block", "language": "Markdown", "rule": { "any": [{ "kind": "list" }, { "kind": "pipe_table" }, { "kind": "fenced_code_block" }] } }
