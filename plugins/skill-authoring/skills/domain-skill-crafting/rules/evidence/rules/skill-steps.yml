{
  "id": "step-candidate",
  "language": "Markdown",
  "files": ["**/SKILL.md"],
  "rule":
    {
      "all":
        [
          {
            "any":
              [
                { "matches": "numbered-item" },
                { "matches": "numbered-heading-section" },
                { "matches": "step-heading-section" },
              ],
          },
          { "not": { "inside": { "kind": "block_quote", "stopBy": "end" } } },
          {
            "not":
              {
                "all":
                  [
                    { "matches": "numbered-item" },
                    {
                      "inside":
                        {
                          "any":
                            [
                              { "matches": "numbered-heading-section" },
                              { "matches": "step-heading-section" },
                            ],
                          "stopBy": "end",
                        },
                    },
                  ],
              },
          },
        ],
    },
}
---
{
  "id": "completion",
  "language": "Markdown",
  "files": ["**/SKILL.md"],
  "rule":
    {
      "all":
        [
          { "kind": "paragraph", "regex": "\\bCompletion:" },
          { "not": { "inside": { "kind": "block_quote", "stopBy": "end" } } },
        ],
    },
}
---
{
  "id": "load",
  "language": "Markdown",
  "files": ["**/SKILL.md", "**/references/**/*.md"],
  "rule":
    {
      "all":
        [
          { "kind": "paragraph", "regex": "\\b(?:load|dispatch)\\s+`[^`]+`" },
          { "not": { "inside": { "kind": "block_quote", "stopBy": "end" } } },
        ],
    },
}
---
{
  "id": "branch",
  "language": "Markdown",
  "files": ["**/SKILL.md", "**/references/**/*.md"],
  "rule":
    {
      "all":
        [
          { "kind": "paragraph", "regex": "^(?:IF|If|if|When|when)\\b" },
          { "not": { "inside": { "kind": "block_quote", "stopBy": "end" } } },
        ],
    },
}
---
{ "id": "section-heading", "language": "Markdown", "rule": { "kind": "section" } }
---
{
  "id": "standards-section",
  "language": "Markdown",
  "files": ["**/SKILL.md", "**/references/**/*.md"],
  "rule":
    {
      "all":
        [
          { "matches": "standards-heading-section" },
          { "not": { "inside": { "matches": "quoted", "stopBy": "end" } } },
        ],
    },
}
---
{
  "id": "reference-section",
  "language": "Markdown",
  "files": ["**/references/**/*.md"],
  "rule":
    {
      "all":
        [
          {
            "kind": "section",
            "has": { "kind": "atx_heading", "regex": "^##\\s+", "stopBy": "neighbor" },
          },
          { "not": { "inside": { "matches": "quoted", "stopBy": "end" } } },
        ],
    },
}
---
{
  "id": "reference-opening",
  "language": "Markdown",
  "files": ["**/references/**/*.md"],
  "rule":
    {
      "any":
        [
          {
            "kind": "paragraph",
            "inside":
              {
                "kind": "section",
                "has": { "kind": "atx_heading", "regex": "^#\\s+", "stopBy": "neighbor" },
              },
          },
          {
            "kind": "list_item",
            "inside":
              {
                "kind": "list",
                "inside":
                  {
                    "kind": "section",
                    "has": { "kind": "atx_heading", "regex": "^#\\s+", "stopBy": "neighbor" },
                  },
              },
          },
        ],
    },
}
