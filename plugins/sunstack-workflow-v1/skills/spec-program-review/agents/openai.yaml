interface:
  display_name: "Spec: Program Review"
  short_description: "Classify or review Why, What, structural How, and the proof plan"
  default_prompt: "Use spec-program-review to classify whether a specification-only or program-only change semantically requires independent review, or to independently review a Specification, Program Design, or the four-document design set (Requirements, Specification, Program Design, Verification Design) for correctness, scope fidelity, reader understanding, current/proposed call paths, and planning readiness without editing or accepting them. Route standalone security audits or threat models to audit-security-review."
