{
  "id": "design-item-start",
  "language": "Html",
  "rule": {
    "kind": "start_tag",
    "all": [
      {
        "has": {
          "kind": "tag_name",
          "regex": "(?i)^aside$"
        }
      },
      {
        "has": {
          "kind": "attribute",
          "all": [
            {
              "has": {
                "kind": "attribute_name",
                "regex": "(?i)^data-design-item$"
              }
            }
          ]
        }
      }
    ],
    "not": {
      "inside": {
        "stopBy": "end",
        "kind": "element",
        "has": {
          "kind": "start_tag",
          "regex": "(?i)^<(?:template|pre|code)(?:\\s|>)"
        }
      }
    }
  }
}
