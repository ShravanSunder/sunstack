{
  "id": "design-item-authority-unproved",
  "language": "Html",
  "rule": {
    "kind": "start_tag",
    "all": [
      {
        "has": {
          "kind": "tag_name",
          "regex": "(?i)^aside$"
        }
      },
      {
        "has": {
          "any": [
            {
              "kind": "attribute",
              "all": [
                {
                  "has": {
                    "kind": "attribute_name",
                    "regex": "(?i)^data-authority$"
                  }
                },
                {
                  "has": {
                    "kind": "attribute_value",
                    "regex": "&",
                    "stopBy": "end"
                  }
                }
              ]
            },
            {
              "all": [
                {
                  "kind": "attribute",
                  "all": [
                    {
                      "has": {
                        "kind": "attribute_name",
                        "regex": "(?i)^data-authority$"
                      }
                    }
                  ]
                },
                {
                  "follows": {
                    "kind": "attribute",
                    "all": [
                      {
                        "has": {
                          "kind": "attribute_name",
                          "regex": "(?i)^data-authority$"
                        }
                      }
                    ],
                    "stopBy": "end"
                  }
                }
              ]
            }
          ]
        }
      }
    ]
  }
}
