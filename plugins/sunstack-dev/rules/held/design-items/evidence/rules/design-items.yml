{
  "id": "design-item-quote-present",
  "language": "Html",
  "rule": {
    "kind": "start_tag",
    "inside": {
      "kind": "element",
      "has": {
        "kind": "element",
        "all": [
          {
            "has": {
              "kind": "start_tag",
              "regex": "(?i)^<blockquote(?:\\s|>)"
            }
          },
          {
            "has": {
              "kind": "text",
              "regex": "(?s)\\A[^&]*[^\\s&][^&]*\\z",
              "not": {
                "inside": {
                  "stopBy": "end",
                  "kind": "element",
                  "has": {
                    "kind": "start_tag",
                    "regex": "(?i)^<(?:template|script|style)(?:\\s|>)"
                  }
                }
              },
              "stopBy": "end"
            }
          }
        ]
      }
    }
  }
}
