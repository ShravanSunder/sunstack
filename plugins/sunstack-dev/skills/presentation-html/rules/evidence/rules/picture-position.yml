  unsupported-boundary-sibling:
    any:
      - matches: heading-bearing-wrapper
      - matches: opaque-markdown-island
      - kind: element
        has:
          matches: opaque-markdown-island
          stopBy: end
  direct-heading-boundary:
    all:
      - matches: outline-heading
      - not:
          matches: unsupported-boundary-sibling
  native-picture-element:
    kind: element
    has:
      any:
        - kind: start_tag
        - kind: self_closing_tag
      regex: '(?i)^<(?:figure|img|picture|svg|canvas|ex-mermaid|ex-diagram|ex-flow|ex-board|ex-trace|ex-tree|ex-call-stack)(?:\s|/?>)'
    not:
      inside:
        stopBy: end
        kind: element
        has:
          kind: start_tag
          regex: '(?i)^<template(?:\s|>)'
  picture-element:
    any:
      - matches: native-picture-element
      - matches: canonical-mermaid-island
  picture-bearing-sibling:
    any:
      - matches: picture-element
      - kind: element
        has:
          matches: picture-element
          stopBy: end
