# A choice is supported only when its closest outline boundary is a direct
# sibling heading. An intervening wrapper with a heading is explicitly unknown.
# Markdown islands are parsed separately (island-markdown.yml): their pictures
# and headings reach the choice through section-scoped kind fields.
id: choice-with-direct-heading-boundary
language: Html
rule:
  all:
    - matches: answer-control
    - follows:
        matches: direct-heading-boundary
        stopBy:
          matches: unsupported-boundary-sibling
utils:
  answer-control:
    kind: element
    has:
      kind: start_tag
      regex: '(?i)^<ex-choice(?:\s|>)'
    not:
      inside:
        stopBy: end
        kind: element
        has:
          kind: start_tag
          regex: '(?i)^<template(?:\s|>)'
  outline-heading:
    kind: element
    has:
      kind: start_tag
      regex: '(?i)^<h[1-6](?:\s|>)'
    not:
      inside:
        stopBy: end
        kind: element
        has:
          kind: start_tag
          regex: '(?i)^<(?:template|ex-choice|ex-compare|ex-mermaid)(?:\s|>)'
  heading-bearing-wrapper:
    kind: element
    has:
      matches: outline-heading
      stopBy: end
  unsupported-boundary-sibling:
    matches: heading-bearing-wrapper
  direct-heading-boundary:
    all:
      - matches: outline-heading
      - not:
          matches: unsupported-boundary-sibling
  picture-element:
    matches: html-picture-element
  picture-bearing-sibling:
    any:
      - matches: picture-element
      - kind: element
        has:
          matches: picture-element
          stopBy: end
---
# Both the boundary and the preceding picture use parsed nodes. A wrapper that
# carries another outline heading cannot borrow an earlier picture across it.
id: choice-with-earlier-section-picture
language: Html
rule:
  all:
    - matches: answer-control
    - follows:
        matches: direct-heading-boundary
        stopBy:
          matches: unsupported-boundary-sibling
    - follows:
        matches: picture-bearing-sibling
        stopBy:
          any:
            - matches: outline-heading
            - matches: unsupported-boundary-sibling
utils:
  answer-control:
    kind: element
    has:
      kind: start_tag
      regex: '(?i)^<ex-choice(?:\s|>)'
    not:
      inside:
        stopBy: end
        kind: element
        has:
          kind: start_tag
          regex: '(?i)^<template(?:\s|>)'
  outline-heading:
    kind: element
    has:
      kind: start_tag
      regex: '(?i)^<h[1-6](?:\s|>)'
    not:
      inside:
        stopBy: end
        kind: element
        has:
          kind: start_tag
          regex: '(?i)^<(?:template|ex-choice|ex-compare|ex-mermaid)(?:\s|>)'
  heading-bearing-wrapper:
    kind: element
    has:
      matches: outline-heading
      stopBy: end
  unsupported-boundary-sibling:
    matches: heading-bearing-wrapper
  direct-heading-boundary:
    all:
      - matches: outline-heading
      - not:
          matches: unsupported-boundary-sibling
  picture-element:
    matches: html-picture-element
  picture-bearing-sibling:
    any:
      - matches: picture-element
      - kind: element
        has:
          matches: picture-element
          stopBy: end
