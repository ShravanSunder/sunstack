# A choice is supported only when its closest outline boundary is a direct
# sibling heading. An intervening wrapper with a heading is explicitly unknown.
id: choice-with-direct-heading-boundary
language: Html
rule:
  all:
    - matches: answer-control
    - follows:
        matches: direct-heading-boundary
        stopBy:
          matches: unsupported-boundary-sibling
utils:
  answer-control:
    kind: element
    has:
      kind: start_tag
      regex: '(?i)^<ex-choice(?:\s|>)'
    not:
      inside:
        stopBy: end
        kind: element
        has:
          kind: start_tag
          regex: '(?i)^<template(?:\s|>)'
  outline-heading:
    kind: element
    has:
      kind: start_tag
      regex: '(?i)^<h[1-6](?:\s|>)'
    not:
      inside:
        stopBy: end
        kind: element
        has:
          kind: start_tag
          regex: '(?i)^<(?:template|ex-choice|ex-compare|ex-mermaid)(?:\s|>)'
  heading-bearing-wrapper:
    kind: element
    has:
      matches: outline-heading
      stopBy: end
  canonical-mermaid-island:
    kind: element
    regex: >-
      (?is)\A<ex-markdown\b[^<>]*>\s*<script\s+type=["']text/markdown["']>(?:[ \t]*\r?\n)*[ ]{0,3}```mermaid[ \t]*\r?\n[^`]*\r?\n[ ]{0,3}```[ \t]*(?:\r?\n[ \t]*)*</script>\s*</ex-markdown>\z
    not:
      inside:
        stopBy: end
        kind: element
        has:
          kind: start_tag
          regex: '(?i)^<template(?:\s|>)'
  plain-markdown-island:
    kind: element
    regex: >-
      (?is)\A<ex-markdown\b[^<>]*>\s*<script\s+type=["']text/markdown["']>[^<]*</script>\s*</ex-markdown>\z
    not:
      has:
        kind: script_element
        has:
          kind: raw_text
          regex: >-
            (?m)^[ \t]*(?:`{3,}|~{3,}|(?:=+|-+)[ \t]*$)|[#>]|!\[
  opaque-markdown-island:
    kind: element
    has:
      kind: start_tag
      regex: '(?i)^<ex-markdown(?:\s|>)'
    not:
      any:
        - matches: canonical-mermaid-island
        - matches: plain-markdown-island
  unsupported-boundary-sibling:
    any:
      - matches: heading-bearing-wrapper
      - matches: opaque-markdown-island
      - kind: element
        has:
          matches: opaque-markdown-island
          stopBy: end
  direct-heading-boundary:
    all:
      - matches: outline-heading
      - not:
          matches: unsupported-boundary-sibling
  native-picture-element:
    kind: element
    has:
      any:
        - kind: start_tag
        - kind: self_closing_tag
      regex: '(?i)^<(?:figure|img|picture|svg|canvas|ex-mermaid|ex-diagram|ex-flow|ex-board|ex-trace|ex-tree|ex-call-stack)(?:\s|/?>)'
    not:
      inside:
        stopBy: end
        kind: element
        has:
          kind: start_tag
          regex: '(?i)^<template(?:\s|>)'
  picture-element:
    any:
      - matches: native-picture-element
      - matches: canonical-mermaid-island
  picture-bearing-sibling:
    any:
      - matches: picture-element
      - kind: element
        has:
          matches: picture-element
          stopBy: end
---
# Both the boundary and the preceding picture use parsed nodes. A wrapper that
# carries another outline heading cannot borrow an earlier picture across it.
id: choice-with-earlier-section-picture
language: Html
rule:
  all:
    - matches: answer-control
    - follows:
        matches: direct-heading-boundary
        stopBy:
          matches: unsupported-boundary-sibling
    - follows:
        matches: picture-bearing-sibling
        stopBy:
          any:
            - matches: outline-heading
            - matches: unsupported-boundary-sibling
utils:
  answer-control:
    kind: element
    has:
      kind: start_tag
      regex: '(?i)^<ex-choice(?:\s|>)'
    not:
      inside:
        stopBy: end
        kind: element
        has:
          kind: start_tag
          regex: '(?i)^<template(?:\s|>)'
  outline-heading:
