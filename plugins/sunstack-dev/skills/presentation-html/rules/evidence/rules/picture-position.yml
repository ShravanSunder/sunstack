  plain-markdown-island:
    kind: element
    regex: >-
      (?is)\A<ex-markdown\b[^<>]*>\s*<script\s+type=["']text/markdown["']>[^<]*</script>\s*</ex-markdown>\z
    not:
      has:
        kind: script_element
        has:
          kind: raw_text
          regex: >-
            (?m)^[ \t]*(?:`{3,}|~{3,}|(?:=+|-+)[ \t]*$)|[#>]|!\[
  opaque-markdown-island:
    kind: element
    has:
      kind: start_tag
      regex: '(?i)^<ex-markdown(?:\s|>)'
    not:
      any:
        - matches: canonical-mermaid-island
