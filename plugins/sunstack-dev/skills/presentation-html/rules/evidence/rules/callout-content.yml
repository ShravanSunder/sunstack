# A callout measured as one block (long-callout nudge). The callout's prose is
# the html-prose pieces inside it: the callout itself when it is plain text, or
# its inner paragraphs and lists when it holds a list, table, code or picture.
id: html-callout
language: Html
rule:
  kind: element
  regex: '^<ex-callout(?:\s|>)'
---
# A Markdown island inside a callout: its text is not read as the callout's
# prose, so a callout that holds one is left to the author (uncertain).
id: callout-markdown-island
language: Html
rule:
  any:
    - all:
        - kind: element
        - regex: '^<ex-markdown(?:\s|>)'
    - all:
        - kind: script_element
        - regex: '^<script\b[^>]*\btype="text/markdown"'
