interface:
  display_name: "Design: Review"
  short_description: "Independently review a design and its ties, top to bottom"
  default_prompt: "Use $design-review to independently review Requirements, Specification, Program Design, Test Design or Verification Design, alone or together: check each document on its own, follow every requirement down to its rules, structure, tests and proof and every piece back up, flag anything invented, and route each finding to the skill that owns the fix, without editing or accepting. Route standalone security audits or threat models to ops-security-review."
