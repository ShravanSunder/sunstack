# Pieces and rows of a v2 HTML design set. Each element is matched on its own
# start tag (a direct child of the element), never with `stopBy: end`, so an
# ancestor of an id-bearing element is not itself a match.
id: need-element
language: Html
files: ["**/requirements.html"]
rule:
  kind: element
  has: {kind: start_tag, regex: '^<[A-Za-z][^>]*\sid="U[0-9]+"'}
---
id: obligation-element
language: Html
files: ["**/specification.html"]
rule:
  kind: element
  has: {kind: start_tag, regex: '^<[A-Za-z][^>]*\sid="R[0-9]+"'}
---
id: entity-element
language: Html
files: ["**/specification.html"]
rule:
  kind: element
  has: {kind: start_tag, regex: '^<[A-Za-z][^>]*\sid="E[0-9]+"'}
---
# The visible text of a coverage row: text nodes inside a table row that is inside
# the element with id="coverage", or inside an element that follows a heading with
# id="coverage" with no heading between. Comments and attribute values are not text.
id: coverage-row-text
language: Html
rule:
  kind: text
  inside:
    stopBy: end
    kind: element
    has: {kind: start_tag, regex: '^<tr\b'}
    any:
      - inside: {stopBy: end, kind: element, has: {kind: start_tag, regex: '^<[A-Za-z][^>]*\sid="coverage"'}}
      - inside:
          stopBy: end
          kind: element
          follows:
            stopBy: {kind: element, has: {kind: start_tag, regex: '^<h[1-6]\b'}}
            kind: element
            has: {kind: start_tag, regex: '^<h[1-6][^>]*\sid="coverage"'}
---
# The visible text of an entity-binding row, placed the same way under id="bindings".
id: binding-row-text
language: Html
rule:
  kind: text
  inside:
    stopBy: end
    kind: element
    has: {kind: start_tag, regex: '^<tr\b'}
    any:
      - inside: {stopBy: end, kind: element, has: {kind: start_tag, regex: '^<[A-Za-z][^>]*\sid="bindings"'}}
      - inside:
          stopBy: end
          kind: element
          follows:
            stopBy: {kind: element, has: {kind: start_tag, regex: '^<h[1-6]\b'}}
            kind: element
            has: {kind: start_tag, regex: '^<h[1-6][^>]*\sid="bindings"'}
---
# A trace link: an element whose own start tag links to a passage, a #fragment
# on a page of the set (index, requirements, specification, program-design or
# verification .html) or on its own page. Page-only links, assets, external URLs
# and other files are outside the standard.
id: trace-link
language: Html
rule:
  kind: element
  has:
    kind: start_tag
    regex: '^<[A-Za-z][^>]*\shref="(?:(?:\./)?(?:index|requirements|specification|program-design|verification)\.html)?#[^"]+"'
