# A trace link on a design page: an element whose own start tag links to a passage,
# a #fragment on an HTML page in the folder or on its own page. An attribute may have
# whitespace around its `=`, and its value may be double-quoted, single-quoted or
# unquoted, as HTML allows. Page-only links, assets, external URLs and pages in other
# folders are outside the standard.
id: trace-link
language: Html
rule:
  kind: element
  has:
    kind: start_tag
    regex: '^<[A-Za-z][^>]*\shref\s*=\s*["'']?(?:(?:\./)?[^"''\s>/:#]+\.html)?#[^"''\s>]+'
